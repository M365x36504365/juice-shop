name: Deploy Infrastructure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  DeployDevInfrastructure:
    name: Deploy Development Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Display Selected Region
        run: echo "Deploying to region: ${{ secrets.LOCATION }}"

      - name: Create Resource Groups
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group create \
              --name ${{ secrets.DEVRESOURCEGROUP }} \
              --location ${{ secrets.LOCATION }} \
              --tags LabInstance=${{ secrets.LABINSTANCEID }}

            az group create \
              --name ${{ secrets.PRODRESOURCEGROUP }} \
              --location ${{ secrets.LOCATION }} \
              --tags LabInstance=${{ secrets.LABINSTANCEID }}

      - name: Deploy DEV Infrastructure (ARM)
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group create \
              --resource-group ${{ secrets.DEVRESOURCEGROUP }} \
              --name deployinfradev \
              --template-file ARM-DevSecOps.json \
              --verbose

  DeployProdInfrastructure:
    name: Deploy Production Infrastructure
    needs: DeployDevInfrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy PROD Infrastructure (ARM)
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group create \
              --resource-group ${{ secrets.PRODRESOURCEGROUP }} \
              --name deployinfraprod \
              --template-file ARM-DevSecOps-Prod.json \
              --verbose
